# SC-009：契约只读守门（AI-robust Hard）。
# 跑 `pnpm codegen` 后断言 packages/contracts/src/ 无 diff —— 业务包手改生成物即红。
name: codegen-diff

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  codegen-readonly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gocell-web
        uses: actions/checkout@v4
        with:
          path: gocell-web

      # 后端契约源仓库，checkout 为 gocell-web 的同级目录（codegen 默认读 ../gocell/contracts）。
      # ghbvf/gocell 为公开仓库 → actions/checkout 匿名克隆即可，无需 token/PAT。
      # （默认 GITHUB_TOKEN 仅限当前仓库；跨仓库只在源仓库为「私有」时才需额外凭据。）
      # 若将来 gocell 转私有，再在 repo secrets 配只读 PAT 并加回 `token:` 行。
      - name: Checkout gocell (backend contracts)
        uses: actions/checkout@v4
        with:
          repository: ghbvf/gocell
          path: gocell

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # gocell-web checkout 在子目录，需显式指向其 package.json 读取 packageManager 版本
          package_json_file: gocell-web/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gocell-web/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: gocell-web

      - name: Regenerate contracts
        run: pnpm codegen
        working-directory: gocell-web

      - name: Assert contracts are read-only (no manual edits)
        run: git diff --exit-code packages/contracts/src/
        working-directory: gocell-web

      # 守门第二段：生成物未漂移后，确认下游消费端类型未被破坏（package-boundaries §CI 步骤 4）。
      - name: Typecheck downstream consumers
        run: pnpm -w typecheck
        working-directory: gocell-web
